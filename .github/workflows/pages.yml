name: pages

# Builds the self-contained research paper (docs/paper) and publishes it to
# GitHub Pages. Using the official pages actions auto-enables Pages for the
# repo - no manual Settings change required.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/paper

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4